{% extends 'new_user_base.html' %}

{% block title %}Sign up{% endblock %}

{% block body %}

{# Theme switching logic #}
{% set is_dark = theme is defined and theme == 'dark' %}

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 {{ 'bg-gray-900' if is_dark else 'bg-blue-50' }}">
  <div class="max-w-md w-full space-y-8">

    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold {{ 'text-white' if is_dark else 'text-gray-900' }}">Sign Up</h2>
    </div>

    <!-- Sign Up Card -->
    <div class="rounded-xl border shadow-xl p-8 {{ 'bg-blue-950 border-cyan-800' if is_dark else 'bg-white border-blue-200' }}">
      <form action="{{ url_for('sign_up') }}" method="POST" class="space-y-6">

        <!-- Full Name -->
        <div>
          <label for="name" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Full Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="Your full name"
          >
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phone" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Phone Number</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="+20 1xx xxxx xxx"
          >
        </div>

        <!-- Specialty -->
        <div>
          <label for="specialty" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Specialty</label>
          <select
            id="specialty"
            name="specialty"
            required
            class="w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
          >
            <option>Web Applications</option>
            <option>Mobile Applications</option>
            <option>Desktop Applications</option>
            <option>AI Applications</option>
            <option>IT</option>
            <option>Embedded Systems</option>
            <option>Cyber Security</option>
          </select>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="you@example.com"
          >
        </div>

        <!-- Department -->
        <div>
          <label for="department" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Department</label>
          <select
            id="department"
            name="department"
            required
            class="w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
          >
            <option>Computer Science</option>
            <option>Information Systems</option>
            <option>Business</option>
            <option>Management</option>
          </select>
        </div>

        <!-- Graduation Year -->
        <div>
          <label for="year" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Graduation Year</label>
          <input
            id="year"
            name="year"
            type="text"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="2026"
          >
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="••••••••"
          >
        </div>

        <!-- Submit Button -->
        <div>
          <button
            type="submit"
            class="w-full py-3 px-4 font-semibold rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 shadow-sm
              {{ 'bg-cyan-700 hover:bg-cyan-600 text-white focus:ring-cyan-400 focus:ring-offset-blue-950' if is_dark 
                 else 'bg-blue-600 hover:bg-blue-700 text-white focus:ring-blue-500 focus:ring-offset-white' }}"
          >
            Sign Up
          </button>
        </div>

      </form>

      <!-- Message (if any) -->
      {% if massage %}
        <p class="mt-4 text-center text-sm font-medium {{ 'text-red-400' if is_dark else 'text-red-600' }}">{{ massage }}</p>
      {% endif %}

      <!-- Sign In Link -->
      <div class="mt-6 text-center">
        <a href="{{ url_for('sign_in') }}" class="text-sm font-medium transition-colors
          {{ 'text-cyan-400 hover:text-cyan-300' if is_dark else 'text-blue-600 hover:text-blue-800' }}">
          Already have an account? Sign in
        </a>
      </div>
    </div>

  </div>
</div>

{% endblock %}
