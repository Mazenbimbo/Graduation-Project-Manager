{% extends 'new_user_base.html' %}

{% block title %} Sign In {% endblock %}

{% block body %}

{# Theme switching logic #}
{% set is_dark = theme is defined and theme == 'dark' %}

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 {{ 'bg-gray-900' if is_dark else 'bg-blue-50' }}">
  <div class="max-w-md w-full space-y-8">
    
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold {{ 'text-white' if is_dark else 'text-gray-900' }}">Sign In</h2>
    </div>

    <!-- Sign In Card -->
    <div class="rounded-xl border shadow-xl p-8 {{ 'bg-blue-950 border-cyan-800' if is_dark else 'bg-white border-blue-200' }}">
      <form action="{{ url_for('sign_in') }}" method="POST" class="space-y-6">
        
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="you@example.com"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium mb-1 {{ 'text-gray-300' if is_dark else 'text-gray-700' }}">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="w-full px-4 py-3 rounded-lg placeholder-gray-500 focus:outline-none focus:ring-2 transition-all
              {{ 'bg-gray-800 text-white border border-cyan-800 focus:ring-cyan-500 focus:border-transparent' if is_dark 
                 else 'bg-white text-gray-900 border border-gray-300 focus:ring-blue-500 focus:border-transparent' }}"
            placeholder="••••••••"
          >
        </div>

        <!-- Submit Button -->
        <div>
          <button
            type="submit"
            class="w-full py-3 px-4 font-semibold rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 shadow-sm
              {{ 'bg-cyan-700 hover:bg-cyan-600 text-white focus:ring-cyan-400 focus:ring-offset-blue-950' if is_dark 
                 else 'bg-blue-600 hover:bg-blue-700 text-white focus:ring-blue-500 focus:ring-offset-white' }}"
          >
            Sign In
          </button>
        </div>
      </form>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <a href="{{ url_for('sign_up') }}" class="text-sm font-medium transition-colors
          {{ 'text-cyan-400 hover:text-cyan-300' if is_dark else 'text-blue-600 hover:text-blue-800' }}">
          Don't have an account? Register here
        </a>
        
      </div>
<div class="mt-6 text-center">
      <a href="/supervisor_signin" class="text-sm font-medium transition-colors
          {{ 'text-cyan-400 hover:text-cyan-300' if is_dark else 'text-blue-600 hover:text-blue-800' }}">
          I'am a supervisor!
        </a>
    </div>

  </div>
</div>

{% endblock %}
