{%extends 'base.html'%}
{%block title%}Sign in{%endblock%}
{%block body%}
<div class="flex flex-col items-center m-5 space-y-5">
<h1 class="text-3xl font-extrabold">Sign in</h1>
<div class="flex flex-col items-center bg-gray-700 w-[30%] h-50 border border-syan-2 rounded-2xl p-5">
    <form class="flex flex-col items-center" action="{{url_for('sign_in')}}" method="POST">
        <input name="email" type="email" placeholder="Email" class="flex flex-col items-center space-y-2 rounded-xl p-2 m-2 w-full text-black">
        <input name="password" type="password" placeholder="Password"class="flex flex-col items-center space-y-2 rounded-xl p-2 m-2 w-full text-black">
        <input type="submit" value="Login" class="flex flex-col items-center space-y-2 rounded-xl p-2 m-2 w-full bg-blue-600 font-bold">
        <div class="flex justify-start"><input type="checkbox" name="supervisor"><label for="supervisor"> is supervisor</label></div>
    </form>
    <a href="/role" class="text-blue-400 underline">I Don't Have an Account</a>
    {% if massage %}
    {{massage}}
    {% endif %}
</div>
</div>
{%endblock%}
