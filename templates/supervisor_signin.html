{%extends 'base.html'%}
{%block title%}Sign in{%endblock%}
{%block body%}
<h1>Sign in</h1>
<div>
    <form action="{{url_for('supervisor_signin')}}" method="POST">
        <input name="email" type="email" placeholder="Email" class="inpt"><br>
        <input name="password" type="password" placeholder="Password"class="inpt" ><br>
        <input type="submit" value="submit" class="btn"><br>
    </form>
    <a href="/role">I Don't Have an Account</a>
    {% if massage %}
    {{massage}}
    {% endif %}
</div>
{%endblock%}
