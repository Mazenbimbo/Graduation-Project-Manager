{% extends 'new_user_base.html' %}

{% block title %} Supervisor Sign In {% endblock %}

{% block body %}

<div class="min-h-screen bg-gray-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold text-white">Supervisor Sign In</h2>
      <p class="mt-2 text-sm text-gray-400">Access your dashboard</p>
    </div>

    <!-- Sign In Card -->
    <div class="bg-blue-950 rounded-xl border border-cyan-800 shadow-xl p-8">
      <form action="{{ url_for('supervisor_signin') }}" method="POST" class="space-y-6">
        
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            autocomplete="email" 
            required 
            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
            placeholder="you@example.com"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            autocomplete="current-password" 
            required 
            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
            placeholder="••••••••"
          >
        </div>

        <!-- Submit Button -->
        <div>
          <button 
            type="submit" 
            class="w-full py-3 px-4 bg-cyan-700 hover:bg-cyan-600 text-white font-semibold rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-blue-950"
          >
            Sign In
          </button>
        </div>
      </form>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <a href="{{ url_for('supervisor_signup') }}" class="text-sm text-cyan-400 hover:text-cyan-300 font-medium">
          Don't have an account? Register here
        </a>
      </div>
    </div>

  </div>
</div>

{% endblock %}
