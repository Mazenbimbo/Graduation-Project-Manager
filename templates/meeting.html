{% extends 'supervisor_base.html' %}

{% block title %} Schedule Meeting {% endblock %}

{% block body %}

<div class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-[#1E2A4A] rounded-2xl border-2 border-cyan-400 shadow-xl p-8">
        <h2 class="text-3xl font-bold text-white mb-6">Schedule Meeting</h2>

        <form action="/meeting?project_id={{project_id}}" method="post" class="space-y-6">
            <!-- Meeting Title -->
            <div class="flex flex-col">
                <label for="title" class="text-sm font-medium text-cyan-200 mb-1">Meeting Title</label>
                <input name="title" type="text" required placeholder="e.g. Progress Review Meeting"
                       class="rounded-xl border border-gray-400 bg-white p-3 text-gray-900 w-full focus:ring-2 focus:ring-cyan-400 focus:border-transparent">
            </div>

            <!-- Date & Time -->
            <div class="flex flex-col sm:flex-row sm:gap-4">
                <div class="flex flex-col flex-1">
                    <label class="text-sm font-medium text-cyan-200 mb-1">Date</label>
                    <input name="date" type="date" required
                           class="rounded-xl border border-gray-400 bg-white p-3 text-gray-900 w-full focus:ring-2 focus:ring-cyan-400">
                </div>
                <div class="flex flex-col flex-1 mt-4 sm:mt-0">
                    <label class="text-sm font-medium text-cyan-200 mb-1">Time</label>
                    <input name="time" type="time" required
                           class="rounded-xl border border-gray-400 bg-white p-3 text-gray-900 w-full focus:ring-2 focus:ring-cyan-400">
                </div>
            </div>

            <!-- Meeting Place (Alpine) -->
            <div x-data="{ type: 'online' }">
                <label class="text-sm font-medium text-cyan-200 mb-1 block">Meeting Place</label>
                <div class="flex gap-6 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="in_person" value="in_person" x-model="type"
                               class="accent-cyan-400 w-4 h-4">
                        <span class="text-white">In Person</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="online" value="online" x-model="type" checked
                               class="accent-cyan-400 w-4 h-4">
                        <span class="text-white">Online</span>
                    </label>
                </div>

                <div x-show="type === 'online'" x-transition class="mt-4">
                    <input name="link" type="url" placeholder="Meeting Link (e.g. Zoom/Google Meet)"
                           class="rounded-xl border border-gray-400 bg-white p-3 text-gray-900 w-full focus:ring-2 focus:ring-cyan-400">
                </div>
            </div>

            <!-- Description -->
            <div class="flex flex-col">
                <label for="notes" class="text-sm font-medium text-cyan-200 mb-1">Description (Optional)</label>
                <textarea name="notes" rows="3"
                          class="rounded-xl border border-gray-400 bg-white p-3 text-gray-900 w-full focus:ring-2 focus:ring-cyan-400"></textarea>
            </div>

            <!-- Submit -->
            <div class="flex justify-end">
                <button type="submit"
                        class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-colors">
                    Schedule
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
