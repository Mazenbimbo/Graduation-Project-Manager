{% extends "new_user_base.html" %}

{% block title %}Supervisor Registration{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-2xl">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <!-- Card Header -->
      <div class="bg-blue-600 px-6 py-4">
        <h4 class="text-white text-xl font-semibold text-center">Supervisor Sign‑up</h4>
      </div>
      
      <!-- Card Body -->
      <div class="p-6">
        <form method="POST" action="{{ url_for('supervisor_signup') }}" class="space-y-5">
          <!-- Full Name -->
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" name="name" id="name" required autofocus
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>

          <!-- Phone Number -->
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
            <input type="tel" name="phone" id="phone" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>

          <!-- Email Address -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required minlength="8"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            <p class="mt-1 text-sm text-gray-500">At least 8 characters</p>
          </div>

          <!-- Specialty -->
          <div>
            <label for="specialty" class="block text-sm font-medium text-gray-700 mb-1">Specialty</label>
            <input type="text" name="specialty" id="specialty" placeholder="e.g., Cardiology, General Practice"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
          </div>

          <!-- Role -->
          <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="role" id="role" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
              <option value="" selected disabled>-- Select Role --</option>
              <option value="Doctor">Doctor</option>
              <option value="Assistant">Assistant</option>
            </select>
          </div>

          <!-- Department -->
          <div>
            <label for="department" class="block text-sm font-medium text-gray-700 mb-1">Department</label>
            <select name="department" id="department"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
              <option value="" selected disabled>-- Select Department --</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Systems">Information Systems</option>
              <option value="Business">Business</option>
              <option value="Management">Management</option>
            </select>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              Register Supervisor Account
            </button>
          </div>
        </form>
      </div>
      
      <!-- Card Footer -->
      <div class="bg-gray-50 px-6 py-4 text-center border-t border-gray-200">
        <p class="text-sm text-gray-600">
          Already have an account? 
          <a href="{{ url_for('supervisor_signin') }}" class="text-blue-600 hover:text-blue-800 font-medium">Log in here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
